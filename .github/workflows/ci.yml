name: CI
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

# Single source of truth for the closing-keyword pattern — consumed by the
# traceability gate and pinned by the conventions job's accept/reject fixtures.
# (The board workflows do NOT use this regex — they consume GitHub-resolved
# closingIssuesReferences.) Colon and multi-space forms verified against GitHub's
# parser (story #18, PR #23 experiment): closes: #N, Closes #N, Closes  #N all
# resolve. URL-form refs also resolve but are intentionally rejected here —
# team convention is the "#N" form; the conventions job pins that divergence.
env:
  CLOSING_KEYWORD_RE: '(^|[^a-z])(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: make bootstrap
      - run: make test-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            backend/coverage/
            frontend/coverage/
          if-no-files-found: ignore

  traceability:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: PR must reference a story issue
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=$(gh pr view "$PR" --json body -q .body)
          # Pattern lives in the workflow-level CLOSING_KEYWORD_RE (single source;
          # fixtures pin it in the conventions job)
          echo "$BODY" | grep -qiE "$CLOSING_KEYWORD_RE" || {
            echo "::error::PR body must close a story issue with a closing keyword (e.g. 'Closes #1') — the board's In review/Done automation keys off closing references"; exit 1; }

  story-gate:
    # Merge-layer Ready gate: a PR closing a Backlog (or unboarded) story cannot
    # merge. Branch pushes can't be blocked on GitHub.com — this is the enforcement
    # point where work becomes shared.
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PROJECT_TITLE: ai-sdlc-pilot
    steps:
      - name: Stories closed by this PR must be past Backlog
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::PROJECT_TOKEN secret not set — story-gate cannot verify Ready status; gate OPEN (unreviewed stories may merge)"
            echo "⚠️ PROJECT_TOKEN secret not set — story-gate cannot verify Ready status; skipping (gate OPEN)"; exit 0
          fi
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          RES=$(gh api graphql -f query='
            query($o: String!, $r: String!, $n: Int!) {
              repository(owner: $o, name: $r) {
                pullRequest(number: $n) {
                  closingIssuesReferences(first: 20) {
                    nodes {
                      number state
                      repository { nameWithOwner }
                      labels(first: 50) { nodes { name } }
                      projectItems(first: 50) {
                        nodes {
                          project { title }
                          fieldValues(first: 10) {
                            nodes { ... on ProjectV2ItemFieldSingleSelectValue { name field { ... on ProjectV2SingleSelectField { name } } } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }' -f o="$OWNER" -f r="$REPO_NAME" -F n="$PR_NUMBER")
          STORIES=$(jq -c --arg repo "$GITHUB_REPOSITORY" --arg pt "$PROJECT_TITLE" '
            .data.repository.pullRequest.closingIssuesReferences.nodes[]
            | select(.repository.nameWithOwner == $repo)
            | select(.state == "OPEN")
            | select(any(.labels.nodes[].name; . == "story"))
            | { number: .number,
                status: ([.projectItems.nodes[]? | select(.project.title == $pt)]
                         | map([.fieldValues.nodes[]? | select(.field.name == "Status") | .name] | first)
                         | first // "NOT_ON_BOARD") }' <<<"$RES")
          BAD=0
          while IFS= read -r S; do
            [ -n "$S" ] || continue
            NUM=$(jq -r '.number' <<<"$S")
            ST=$(jq -r '.status' <<<"$S")
            case "$ST" in
              Ready|"In progress"|"In review")
                echo "✅ story #$NUM at $ST — gate open" ;;
              Backlog)
                echo "::error::story #$NUM is at Backlog — review it and promote it to Ready before merging"; BAD=1 ;;
              Done)
                echo "::error::story #$NUM is at Done — its lifecycle is terminal; open a follow-up issue for further work"; BAD=1 ;;
              *)
                echo "::error::story #$NUM is not on the '$PROJECT_TITLE' board — add it and promote it to Ready before merging"; BAD=1 ;;
            esac
          done <<<"$STORIES"
          if [ "$BAD" = "1" ]; then exit 1; fi
          [ -n "$STORIES" ] || echo "no closing-referenced open stories from this repo — gate not applicable"

  conventions:
    # Pins the closing-keyword regex with accept/reject fixtures so the pattern
    # can't silently drift (the traceability gate depends on it; the board
    # workflows consume GitHub-resolved closing references instead)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Closing-keyword regex fixtures
        run: |
          set -euo pipefail
          accept() { if ! echo "$1" | grep -qiE "$CLOSING_KEYWORD_RE"; then echo "::error::regex should ACCEPT: $1"; exit 1; fi; }
          reject() { if   echo "$1" | grep -qiE "$CLOSING_KEYWORD_RE"; then echo "::error::regex should REJECT: $1"; exit 1; fi; }
          # GitHub-resolver-verified forms (PR #23 experiment)
          accept "Closes #16"
          accept "closes: #16"
          accept "Closes  #16"
          accept "Fixes #3"
          accept "resolved #7"
          accept "This PR closes #9 and also fixes #10"
          # Mentions and word-boundary traps must not pass
          reject "disclose #5"
          reject "context: see #9"
          reject "This PR discloses issues close to #12"
          reject "no reference at all"
          reject "Closes https://github.com/foo/bar/issues/9"
          reject "Closes owner/repo#16"
          reject "closes:#16"
          echo "✅ closing-keyword fixtures all pass"
      - name: Heal-filter fixtures (story-done board sweep)
        run: |
          set -euo pipefail
          OUT=$(jq -r --arg repo "test-owner/test-repo" --arg f "Status" --arg done "Done" -f scripts/heal-filter.jq scripts/heal-filter.fixture.json)
          # Two should-matches: a below-Done card AND a no-status card (terminal
          # policy: closed+completed means Done however it's carded); five negatives
          EXPECTED=$(printf 'HEAL_THIS\t42\nNO_STATUS\t48')
          if [ "$OUT" != "$EXPECTED" ]; then
            echo "::error::heal-filter fixture mismatch — expected exactly '$EXPECTED', got: $(echo "$OUT" | tr '\n' '|')"
            exit 1
          fi
          echo "✅ heal-filter fixtures pass (two should-match selected; six negatives rejected)"

  triage:
    needs: [test]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install -g @anthropic-ai/claude-code
      - name: Trust workspace for Claude Code
        env:
          WS: ${{ github.workspace }}
        run: printf '{"projects":{"%s":{"hasTrustDialogAccepted":true}}}' "$WS" > "$HOME/.claude.json"
      - name: Fork guard
        run: |
          set -euo pipefail
          HEAD_OWNER=$(gh pr view "$PR_NUMBER" --json headRepositoryOwner -q .headRepositoryOwner.login)
          if [ "$HEAD_OWNER" != "$OWNER" ]; then
            echo "⚠️ AI triage skipped: PR #$PR_NUMBER originates from fork $HEAD_OWNER"; exit 0
          fi
      - name: AI failure triage
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_DEFAULT_SONNET_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_SONNET_MODEL }}
          ANTHROPIC_DEFAULT_HAIKU_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_HAIKU_MODEL }}
          ANTHROPIC_DEFAULT_OPUS_MODEL: ${{ secrets.ANTHROPIC_DEFAULT_OPUS_MODEL }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_AUTH_TOKEN:-}" ]; then
            echo "::warning::AI triage skipped: ANTHROPIC_AUTH_TOKEN secret not set — failed-test runs will not be auto-classified"
            echo "⚠️ AI triage skipped: ANTHROPIC_AUTH_TOKEN secret not set"; exit 0
          fi
          gh run view "$RUN_ID" --log-failed > failed-logs.txt || true
          claude -p "CI failed on PR #$PR_NUMBER. Failed-job logs are in failed-logs.txt. Classify the failure: real regression vs flaky test vs environment/config problem. Identify the most likely responsible change and the fix. Output concise markdown: classification, evidence, recommended next action. Write to stdout." \
            --allowedTools "Read" "Grep" "Glob" \
            "Bash(gh pr view *)" "Bash(gh issue view *)" "Bash(gh run view *)" \
            --max-turns 15 > triage.md
          gh pr comment "$PR_NUMBER" --body-file triage.md
